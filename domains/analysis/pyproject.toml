[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyleanx-analysis"
version = "0.1.0.dev0"
description = "Analysis for PyLeanX: real and measure-theoretic analysis written as textbook proofs, checked by Lean"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "PyLeanX contributors" }]
dependencies = ["pyleanx>=0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# PyLeanX finds installed domain packages through this entry point (pyleanx.packs).
[project.entry-points."pyleanx.packs"]
analysis = "pyleanx_analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
