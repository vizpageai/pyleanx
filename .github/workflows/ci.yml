name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest tests/unit -q --cov=pyleanx --cov-report=term-missing

  lean-integration:
    # Full proof verification is a release gate; it runs on Linux.
    runs-on: ubuntu-latest
    env:
      PYLEANX_REQUIRE_LEAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Mathlib oleans
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathlib
            lean-project/.lake
          key: mathlib-${{ hashFiles('lean-project/lake-manifest.json', 'lean-project/lean-toolchain') }}
      - name: Fetch prebuilt Mathlib (no source rebuild)
        working-directory: lean-project
        run: lake exe cache get
      - run: pip install -e ".[dev,interactive]"
      - run: pyleanx doctor
      - run: pytest tests -q -s
      - run: python -m build
